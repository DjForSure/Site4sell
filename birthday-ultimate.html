<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday</title>
<script>/* EDIT HERE — everything personal lives in CONFIG */const WA="917571062508";const CONFIG={demo:true,music:"",age:"",recipientName:"Your Love",senderName:"Someone Special",date:"",tagline:"Something special has been waiting for you.",photos:[],timeline:[["Where it began","The day our story started."],["The little moments","Coffee, laughter and long walks."],["The big ones","Every adventure was better with you."],["Today","Another year of you."]],letter:"Dear you,\n\nOn your birthday I want you to know how much you matter to me. You make every ordinary day feel like something worth remembering.",finale:"Happy Birthday",closing:"You are loved, today and always."};</script>
<style>
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}body{background:#0f0a1a;color:#f6e9f0;font-family:Georgia,serif;text-align:center;overflow-x:hidden}
#ld{position:fixed;inset:0;background:#0f0a1a;z-index:50;display:grid;place-items:center;transition:opacity 1s}#ld i{display:block;height:3px;width:0;background:#e8b4c8;margin-top:14px}
#st{position:fixed;inset:0;z-index:0}main{position:relative;z-index:1}
section{min-height:100vh;display:grid;place-items:center;padding:60px 20px;opacity:0;transform:translateY(40px);transition:1.1s}section.in,#hero{opacity:1;transform:none}.w{max-width:700px;width:100%}
h1{font-weight:400;font-size:clamp(2.4rem,11vw,6rem);line-height:1.05}h1 span{display:inline-block;opacity:0;transform:translateY(40px);animation:r 1s forwards}@keyframes r{to{opacity:1;transform:none}}
h2{font-weight:400;color:#e8b4c8;margin-bottom:22px;font-size:1.8rem}.gold{background:linear-gradient(90deg,#e8b4c8,#fff,#e8b4c8);-webkit-background-clip:text;background-clip:text;color:transparent}
button,label,.bt{display:inline-block;font:600 15px system-ui;padding:13px 30px;border-radius:99px;border:1px solid #e8b4c8;background:none;color:#e8b4c8;cursor:pointer;margin:8px}
.t{border-left:2px solid #e8b4c8;text-align:left;margin-left:12px}.t div{padding:0 0 26px 22px;position:relative}.t div:before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:#e8b4c8}.t b{color:#e8b4c8}
#gi{width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:18px;box-shadow:0 20px 60px #0008;background:#2a1d3a}
.ltr{background:#fff8f0;color:#3a2a3a;border-radius:14px;padding:28px;text-align:left;line-height:1.9;min-height:200px;white-space:pre-wrap}
.box{position:relative;width:160px;height:150px;margin:40px auto 20px;cursor:pointer}.bx{position:absolute;bottom:0;width:160px;height:110px;background:#c9617f;border-radius:6px}.bx:after{content:"";position:absolute;left:68px;top:0;bottom:0;width:24px;background:#f6d6a8}
.lid{position:absolute;bottom:105px;left:-8px;width:176px;height:44px;background:#d9748f;border-radius:6px;transition:1s;transform-origin:left bottom;z-index:2}.open .lid{transform:translateY(-70px) rotate(-35deg);opacity:.4}.open .bx{box-shadow:0 -20px 60px #f6d6a8}
.cake{position:relative;width:200px;height:130px;margin:60px auto 20px}.c1{position:absolute;bottom:0;width:200px;height:55px;background:#d77a9f;border-radius:10px}.c2{position:absolute;bottom:55px;left:25px;width:150px;height:45px;background:#f4b6cf;border-radius:10px 10px 0 0}
.k{position:absolute;bottom:100px;width:8px;height:28px;background:#cfe6ff;border-radius:3px}.k b{position:absolute;top:-16px;left:-2px;width:12px;height:16px;background:#ffb347;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fl .4s infinite alternate}.out b{display:none}@keyframes fl{to{transform:scale(1.2,.9)}}
@media(prefers-reduced-motion:reduce){h1 span{animation:none;opacity:1;transform:none}section{transition:none}}
#wi{width:100%;max-width:360px;padding:12px 18px;border-radius:99px;border:1px solid #e8b4c8;background:#ffffff14;color:#fff;font:16px Georgia,serif;text-align:center}</style></head><body>
<div id="ld"><div><p>Preparing something special…</p><i></i></div></div>
<canvas id="st"></canvas>
<main>
<section id="hero"><div><h1 id="h"></h1><p id="tg" style="margin:20px 0"></p><a class="bt" href="#s1">Begin the journey</a></div></section>
<section id="s1"><div class="w"><h2>Our Story</h2><div class="t" id="tl"></div></div></section>
<section><div class="w"><h2>Memories</h2><img id="gi" alt=""><p id="gc"></p><button id="pv">‹</button><button id="nx">›</button><br><label>Add photos<input type="file" id="up" accept="image/*" multiple hidden></label></div></section>
<section id="lt"><div class="w"><h2>A Letter For You</h2><div class="ltr" id="ltr"></div></div></section>
<section><div class="w"><h2>A Gift, Just For You</h2><div class="box" id="box"><div class="lid"></div><div class="bx"></div></div><p id="hint">Tap the gift</p><div id="cw" hidden><div class="cake"><i class="k" style="left:55px"><b></b></i><i class="k" style="left:96px"><b></b></i><i class="k" style="left:137px"><b></b></i><div class="c2"></div><div class="c1"></div></div><button id="bl">Blow the candles</button></div></div></section>
<section><div class="w"><h2>Make a Wish</h2><input id="wi" placeholder="Type a wish…" maxlength="80"><br><button id="ws">Send it to the stars ✨</button></div></section>
<section><div class="w"><button id="fn">One last surprise</button><h1 id="fin" class="gold"></h1><p id="fm" style="margin-top:16px;font-size:1.2rem"></p></div></section>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),nm=CONFIG.recipientName;
document.title="Happy Birthday "+nm;
function confetti(n=120){const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:99";c.width=innerWidth;c.height=innerHeight;document.body.append(c);const x=c.getContext("2d"),P=[...Array(n)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,v:2+Math.random()*4,r:4+Math.random()*5,h:Math.random()*360,s:Math.random()*2-1}));(function f(){x.clearRect(0,0,c.width,c.height);let a=0;P.forEach(p=>{p.y+=p.v;p.x+=p.s;if(p.y<c.height){a=1;x.fillStyle="hsl("+p.h+",80%,65%)";x.fillRect(p.x,p.y,p.r,p.r*1.6)}});a?requestAnimationFrame(f):c.remove()})()}
const cv=$("#st"),cx=cv.getContext("2d");let S=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;S=[...Array(90)].map(()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.3,t:Math.random()*6}))}
rs();onresize=rs;(function a(){cx.clearRect(0,0,cv.width,cv.height);S.forEach(s=>{s.t+=.03;cx.globalAlpha=.4+.6*Math.abs(Math.sin(s.t));cx.fillStyle="#fff";cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()});requestAnimationFrame(a)})();
$("#h").innerHTML="";let p=0;
const ld=setInterval(()=>{p=Math.min(100,p+2+Math.random()*4);$("#ld i").style.width=p+"%";if(p>=100){clearInterval(ld);setTimeout(()=>{$("#ld").style.opacity=0;setTimeout(()=>$("#ld").remove(),1000);intro()},300)}},90);
function intro(){$("#h").innerHTML=[..."Happy Birthday"].map((c,i)=>`<span style="animation-delay:${i*.08}s">${c==" "?"&nbsp;":c}</span>`).join("")+`<br><span class="gold" style="animation-delay:1.4s"></span>`;$("#h .gold").textContent=nm;const t=CONFIG.tagline+(CONFIG.date?" · "+CONFIG.date:"");$("#tg").textContent=t;if(+CONFIG.age){let a=0;const T=setInterval(()=>{$("#tg").textContent="Turning "+(++a);if(a>=+CONFIG.age){clearInterval(T);$("#tg").textContent="Turning "+a+" · "+t}},110)}}
CONFIG.timeline.forEach(([a,b])=>{const d=document.createElement("div");d.innerHTML="<b></b><p></p>";d.firstChild.textContent=a;d.lastChild.textContent=b;$("#tl").append(d)});
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#2a1d3a"/><text x="200" y="225" font-size="80" text-anchor="middle">📷</text></svg>');
let ph=CONFIG.photos.length?CONFIG.photos:[PH,PH,PH],gi=0;
const sh=()=>{$("#gi").src=ph[gi];$("#gc").textContent=(gi+1)+" / "+ph.length};
$("#pv").onclick=()=>{gi=(gi+ph.length-1)%ph.length;sh()};$("#nx").onclick=()=>{gi=(gi+1)%ph.length;sh()};setInterval(()=>$("#nx").click(),5000);
$("#up").onchange=e=>{if(!e.target.files.length)return;ph=[...e.target.files].map(f=>URL.createObjectURL(f));gi=0;sh()};sh();
let ty=0;const io=new IntersectionObserver(es=>es.forEach(x=>{if(!x.isIntersecting)return;x.target.classList.add("in");if(x.target.id=="lt"&&!ty){ty=1;let i=0;const L=CONFIG.letter+"\n\n— "+CONFIG.senderName,T=setInterval(()=>{$("#ltr").textContent=L.slice(0,++i);if(i>=L.length)clearInterval(T)},35)}}));
$$("section").forEach(s=>io.observe(s));
$("#box").onclick=()=>{$("#box").classList.add("open");$("#hint").style.display="none";setTimeout(()=>{$("#cw").hidden=false;confetti(80)},900)};
$("#bl").onclick=()=>{$$(".k").forEach(k=>k.classList.add("out"));confetti(160)};
$("#fn").onclick=()=>{let c=3;const b=$("#fn");b.disabled=true;const T=setInterval(()=>{b.textContent=c>0?c:"🎉";if(c--<0){clearInterval(T);b.style.display="none";$("#fin").textContent=CONFIG.finale+", "+nm;$("#fm").textContent=CONFIG.closing+" — "+CONFIG.senderName;confetti(160);fire();setTimeout(()=>confetti(160),2500)}},800)};
</script><div id="lb" onclick="this.style.display='none'" style="position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:70"><img alt="" style="max-width:92%;max-height:92%;border-radius:12px"></div>
<script>
$("#gi").style.cursor="zoom-in";$("#gi").onclick=()=>{$("#lb img").src=$("#gi").src;$("#lb").style.display="grid"};
$("#ws").onclick=()=>{const v=$("#wi").value.trim();if(!v)return;const s=document.createElement("div");s.textContent="✨ "+v;s.style.cssText="position:fixed;left:50%;bottom:25vh;transform:translateX(-50%);color:#fff;z-index:60;font-size:20px;text-align:center;max-width:86vw;transition:6s ease-out;opacity:1";document.body.append(s);setTimeout(()=>{s.style.bottom="95vh";s.style.opacity=0},50);setTimeout(()=>s.remove(),6200);$("#wi").value="";confetti(40)};
function fire(){const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:98";c.width=innerWidth;c.height=innerHeight;document.body.append(c);const x=c.getContext("2d"),end=Date.now()+4500;let P=[];const B=()=>{const X=c.width*(.15+Math.random()*.7),Y=c.height*(.15+Math.random()*.4),h=Math.random()*360;for(let i=0;i<60;i++){const a=Math.random()*6.28,s=1+Math.random()*4;P.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h})}};B();const T=setInterval(B,650);setTimeout(()=>clearInterval(T),4000);(function f(){x.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.99;p.l-=.012;x.globalAlpha=p.l;x.fillStyle="hsl("+p.h+",90%,65%)";x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill()});P.length||Date.now()<end?requestAnimationFrame(f):c.remove()})()}
</script>
<div id="pg" style="position:fixed;top:0;left:0;height:3px;width:0;background:#e8b4c8;z-index:45"></div><script>addEventListener("scroll",()=>{document.getElementById("pg").style.width=scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)*100+"%"})</script>
<button id="mu" style="display:none;position:fixed;left:14px;bottom:14px;z-index:40;width:44px;height:44px;padding:0;margin:0;border-radius:50%;border:1px solid #e8b4c8;background:#0008;color:#e8b4c8;font-size:18px;cursor:pointer">🎵</button><script>(()=>{if(!CONFIG.music)return;const a=new Audio(CONFIG.music),b=document.getElementById("mu");a.loop=true;b.style.display="block";b.onclick=()=>a.paused?(a.play(),b.textContent="⏸"):(a.pause(),b.textContent="🎵")})();</script>
<a id="wa" target="_blank" rel="noopener" style="position:fixed;right:14px;bottom:14px;z-index:40;background:#25d366;color:#fff;font:600 14px system-ui;padding:11px 18px;border-radius:99px;text-decoration:none;box-shadow:0 6px 20px #0004">Order this on WhatsApp</a>
<script>/* demo button: set demo:false in CONFIG for the copy you deliver */(()=>{const a=document.getElementById("wa");if(!CONFIG.demo)return a.remove();a.href="https://wa.me/"+WA+"?text="+encodeURIComponent("Hi! I'd like the Birthday Ultimate website (₹499).")})();</script>
</body></html>
